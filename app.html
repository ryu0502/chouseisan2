<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調整さん改</title>
<style>
  /* Chromeのダークモード風の配色に固定(OS/ブラウザの設定に関わらず常にこの配色) */
  :root {
    color-scheme: dark;
    --bg: #202124;
    --panel: #2d2e30;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #8ab4f8;
    --accent-hover: #aecbfa;
    --key: #3c4043;
    --key-hover: #4a4d51;
    --danger: #f28b82;
    --danger-hover: #ee6a60;
    --border: #3c4043;
    --sunday: #f28b82;
    --saturday: #8ab4f8;
    --match-bg: rgba(138, 180, 248, 0.14);
    --match-border: rgba(138, 180, 248, 0.4);
    --wheel-w: 60px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans", "Segoe UI", "Hiragino Sans", system-ui, sans-serif;
    padding: 24px;
  }
  .app {
    max-width: 780px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 20px;
  }
  /* タイトルを左端、月ラベルを右から2番目、月送りボタンを右端に配置 */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .app-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .month-label {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .nav-btn {
    border: none;
    background: transparent;
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--key); }
  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--key);
    border-radius: 999px;
    padding: 4px 12px;
    margin: 8px 0 4px;
  }
  .user-badge .icon { font-size: 16px; }
  .user-badge.readonly { color: var(--danger); }
  .sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  /* ---- スケジュール表示(Googleカレンダーの「スケジュール」表示風: 縦一列の一覧) ---- */
  .schedule-list {
    display: flex;
    flex-direction: column;
  }
  .day-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .day-row:last-child { border-bottom: none; }
  .day-row:hover { background: var(--key); }
  /* 一致(部分一致)があった日は背景を強調して、無い日とのコントラストをはっきりさせる。
     一致した日が連続しても境目が見えるよう、区切り線はやや濃いめの色にする */
  .day-row.has-match {
    background: var(--match-bg);
    border-bottom-color: rgba(138, 180, 248, 0.5);
  }
  .day-row.has-match:hover { background: rgba(138, 180, 248, 0.22); }
  /* 今日より前の日付: Googleカレンダー風にやや控えめなグレーアウト */
  .day-row.past { opacity: 0.6; }

  /* 日付と曜日を横並びで「1(土)」のようにまとめる */
  .day-date {
    flex-shrink: 0;
    width: 40px;
    display: flex;
    align-items: center;
    gap: 1px;
    padding-top: 2px;
  }
  .day-date .num {
    font-size: 13px;
    font-weight: 600;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .day-date .dow {
    font-size: 11px;
    color: var(--muted);
  }
  .day-date .num.sun, .day-date .dow.sun { color: var(--sunday); }
  .day-date .num.sat, .day-date .dow.sat { color: var(--saturday); }
  /* 今日の日付: Googleカレンダーのような塗りつぶし丸 */
  .day-row.today .num {
    background: var(--accent);
    color: var(--bg);
  }

  .day-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-top: 2px;
  }
  /* アイコンごとに幅を揃えて、後ろの時刻表示が縦にきれいに揃うようにする */
  .icon-fixed {
    display: inline-block;
    width: 1.4em;
    text-align: left;
  }
  /* 一致(2人以上)のサマリ: イベントバー風の強めのバッジ表示。アイコン行と時刻行で改行する(通常の1.3倍サイズ) */
  .summary-line {
    font-size: 15px;
    line-height: 1.4;
    color: var(--bg);
    font-weight: 700;
    white-space: pre-line;
    overflow-wrap: break-word;
    padding: 2px 6px;
    border-radius: 4px;
  }
  /* 一致人数が多いほど青が濃くなる段階表示(4人が現行のaccentよりやや濃い色、他は薄く) */
  .summary-line.tier-2 { background: #d3e3fd; }
  .summary-line.tier-3 { background: #a7c6fa; }
  .summary-line.tier-4 { background: #6fa1f5; }
  /* 一致していない単独の予定: 控えめな表示でコントラストをつける。横幅を活かして2列に並べる */
  .solo-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 10px;
  }
  .summary-line-solo {
    flex: 1 1 45%;
    min-width: 100px;
    font-size: 10px;
    line-height: 1.4;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* ---- モーダル ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    padding: 20px;
    width: 400px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-header h2 {
    font-size: 16px;
    margin: 0;
  }
  .close-btn {
    border: none;
    background: var(--key);
    color: var(--text);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .close-btn:hover { background: var(--key-hover); }

  .readonly-notice {
    font-size: 12.5px;
    color: var(--danger);
    background: rgba(242, 139, 130, 0.12);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }

  .picker-labels {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .picker-labels span { flex-shrink: 0; text-align: center; }
  .lbl-normal { width: var(--wheel-w); }
  .lbl-sep { width: 14px; }
  .lbl-sep-wide { width: 20px; }
  .picker-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 10px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .picker-row::-webkit-scrollbar { display: none; }
  .sep {
    font-size: 14px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .wheel-wrap {
    position: relative;
    width: var(--wheel-w);
    height: 180px;
    flex-shrink: 0;
  }
  .wheel-highlight {
    position: absolute;
    left: 0; right: 0;
    top: 72px;
    height: 36px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: rgba(138,180,248,0.12);
    pointer-events: none;
    border-radius: 6px;
  }
  .wheel-viewport {
    position: relative;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    padding: 72px 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .wheel-viewport::-webkit-scrollbar { display: none; }
  .wheel-viewport.dragging {
    cursor: grabbing;
    scroll-snap-type: none;
  }
  .wheel-item {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--muted);
    scroll-snap-align: center;
    user-select: none;
  }
  .wheel-item.selected {
    color: var(--text);
    font-weight: 700;
  }

  .add-entry-btn {
    display: block;
    width: 100%;
    border: none;
    background: var(--accent);
    color: #202124;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 0;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .add-entry-btn:hover { background: var(--accent-hover); }
  .add-entry-btn:active { transform: scale(0.98); }

  .add-separate-btn {
    display: block;
    width: 100%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 0;
    border-radius: 12px;
    cursor: pointer;
    margin: -8px 0 16px;
  }
  .add-separate-btn:hover { background: var(--key); }
  .add-separate-btn:active { transform: scale(0.98); }

  .entry-list-title {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 8px;
  }
  .entry-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--key);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13.5px;
  }
  .entry-row.editing {
    outline: 2px solid var(--accent);
  }
  .entry-row.foreign {
    opacity: 0.7;
  }
  .entry-row .del {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .entry-empty {
    font-size: 12.5px;
    color: var(--muted);
    padding: 6px 2px 2px;
  }

  /* ---- スマホ表示向けの調整 ---- */
  @media (max-width: 480px) {
    :root {
      --wheel-w: 52px;
    }
    body { padding: 10px; }
    .app { padding: 14px; border-radius: 10px; }
    .app-title { font-size: 15px; }
    .month-label { font-size: 12.5px; }
    .sub { font-size: 11.5px; margin-bottom: 8px; }
    .day-row { padding: 5px 2px; gap: 8px; }
    .day-date { width: 34px; }
    .day-date .num { font-size: 11px; width: 17px; height: 17px; line-height: 17px; }
    .day-date .dow { font-size: 9.5px; }
    .summary-line { font-size: 12.5px; padding: 1px 4px; }
    .summary-line-solo { font-size: 8.5px; min-width: 80px; }
    .modal { padding: 14px; border-radius: 16px; }
    .picker-row { gap: 6px; }
    .picker-labels { gap: 6px; font-size: 9.5px; }
    .sep { font-size: 12px; }
    .wheel-item { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1 class="app-title">調整さん改</h1>
      <div class="header-right">
        <span id="monthLabel" class="month-label"></span>
        <div class="nav-group">
          <button class="nav-btn" onclick="changePage(-1)">‹</button>
          <button class="nav-btn" onclick="changePage(1)">›</button>
        </div>
      </div>
    </div>
    <div id="userBadge" class="user-badge"></div>
    <p class="sub">各日付をタップして時間を追加してください。<br>2人以上の時間が重なるとハイライトされます。</p>
    <div class="schedule-list" id="scheduleList"></div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>

      <p class="readonly-notice" id="readonlyNotice" hidden>このURLでは編集できません。自分専用のURL(例: .../repoyaru/ryu)からアクセスすると、自分の時間を登録・編集できます。</p>

      <div id="editorArea">
        <div class="picker-labels">
          <span class="lbl-normal">開始 時</span>
          <span class="lbl-sep"></span>
          <span class="lbl-normal">分</span>
          <span class="lbl-sep-wide"></span>
          <span class="lbl-normal">終了 時</span>
          <span class="lbl-sep"></span>
          <span class="lbl-normal">分</span>
        </div>
        <div class="picker-row">
          <div class="wheel-wrap" id="wheelStartHour"></div>
          <span class="sep">:</span>
          <div class="wheel-wrap" id="wheelStartMinute"></div>
          <span class="sep">〜</span>
          <div class="wheel-wrap" id="wheelEndHour"></div>
          <span class="sep">:</span>
          <div class="wheel-wrap" id="wheelEndMinute"></div>
        </div>

        <button class="add-entry-btn" id="addEntryBtn" onclick="submitEntry(false)">時間を登録</button>
        <button class="add-separate-btn" id="addSeparateBtn" onclick="submitEntry(true)" hidden>別で時間を登録</button>
      </div>

      <p class="entry-list-title">この日に登録された時間</p>
      <div id="entryList"></div>
    </div>
  </div>

<script>
  // URLの末尾セグメントで編集者を固定する
  const USER_MAP = { ryu: '☕', teketeke: '👻', koromo: '衣', sinome: '🤍' };

  function detectCurrentUser() {
    const segments = location.pathname.split('/').filter(Boolean);
    const last = (segments[segments.length - 1] || '').toLowerCase();
    return USER_MAP[last] ? last : null;
  }
  const CURRENT_USER_NAME = detectCurrentUser();          // 例: 'ryu'
  const CURRENT_USER = CURRENT_USER_NAME ? USER_MAP[CURRENT_USER_NAME] : null; // 例: '☕'

  const HOURS = Array.from({ length: 24 }, (_, i) => i);  // 0〜23時(23の次は0にループ)
  const MINUTES = [0, 15, 30, 45];
  const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

  const API_URL = '/api/schedule';
  let schedule = {};            // { 'YYYY-MM-DD': [{id, person, startMin, endMin}] }
  let pageOffset = 0;           // 30日単位でのページ送り(0が既定表示: 前日〜29日後)
  let activeDateStr = null;

  const today = new Date();
  const todayStr = dateStr(today.getFullYear(), today.getMonth(), today.getDate());

  async function fetchSchedule() {
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      return await res.json();
    } catch (e) {
      console.error('スケジュールの取得に失敗しました', e);
      return schedule; // 失敗時は直前の状態を保持
    }
  }

  async function saveSchedule() {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(schedule),
      });
      if (!res.ok) throw new Error('save failed: ' + res.status);
    } catch (e) {
      console.error('スケジュールの保存に失敗しました', e);
      alert('保存に失敗しました。通信環境を確認してもう一度お試しください。');
    }
  }

  async function refreshAndRender() {
    schedule = await fetchSchedule();
    renderCalendar();
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
  function formatHM(totalMin) {
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${h}:${pad2(m)}`;
  }

  function renderUserBadge() {
    const el = document.getElementById('userBadge');
    if (CURRENT_USER) {
      el.classList.remove('readonly');
      el.innerHTML = `${CURRENT_USER_NAME}<span class="icon">${CURRENT_USER}</span>でログイン中`;
    } else {
      el.classList.add('readonly');
      el.textContent = '閲覧専用URL(自分のURLからアクセスすると編集できます)';
    }
  }

  // ---------- カレンダー描画 ----------
  function changePage(diff) {
    pageOffset += diff;
    refreshAndRender();
  }

  // 一致(2人以上)と単独(1人)の両方の帯を、時間帯ごとにまとめて返す
  function computeDaySummaries(entries) {
    if (!entries || entries.length === 0) return { matched: [], solo: [] };
    const norm = entries.map(e => {
      let end = e.endMin;
      if (end <= e.startMin) end += 24 * 60;
      return { person: e.person, start: e.startMin, end };
    });
    const points = Array.from(new Set(norm.flatMap(e => [e.start, e.end]))).sort((a, b) => a - b);
    const segments = [];
    for (let i = 0; i < points.length - 1; i++) {
      const t1 = points[i], t2 = points[i + 1];
      if (t1 === t2) continue;
      const active = Array.from(new Set(norm.filter(e => e.start <= t1 && e.end >= t2).map(e => e.person)));
      if (active.length > 0) segments.push({ people: active, start: t1, end: t2 });
    }
    // 同じメンバー構成が連続していたら結合する
    const merged = [];
    for (const seg of segments) {
      const key = seg.people.slice().sort().join(',');
      const last = merged[merged.length - 1];
      if (last && last.key === key && last.end === seg.start) {
        last.end = seg.end;
      } else {
        merged.push({ key, people: seg.people, start: seg.start, end: seg.end });
      }
    }
    // 表示は常に0〜23時表記に揃える(日またぎの内部計算では24時以降になり得るため% 1440で戻す)
    const matched = merged
      .filter(s => s.people.length >= 2)
      .map(s => ({ icons: s.people, start: s.start % 1440, end: s.end % 1440 }));
    const solo = merged
      .filter(s => s.people.length === 1)
      .map(s => ({ icon: s.people[0], start: s.start % 1440, end: s.end % 1440 }));
    return { matched, solo };
  }

  const VISIBLE_DAYS = 30;

  function renderCalendar() {
    renderUserBadge();

    // 過去の日付は前日までしか見せず、そこから合計30日分だけを表示するローリング表示
    const rangeStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1 + pageOffset * VISIBLE_DAYS);
    document.getElementById('monthLabel').textContent = `${rangeStart.getFullYear()}年${rangeStart.getMonth() + 1}月`;

    const list = document.getElementById('scheduleList');
    list.innerHTML = '';

    for (let i = 0; i < VISIBLE_DAYS; i++) {
      const cellDate = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i);
      const ds = dateStr(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
      const dow = cellDate.getDay();
      const isPast = ds < todayStr;
      const dowClass = dow === 0 ? ' sun' : dow === 6 ? ' sat' : '';

      const row = document.createElement('div');
      row.className = 'day-row'
        + (isPast ? ' past' : '')
        + (ds === todayStr ? ' today' : '');
      row.onclick = () => openModal(ds);

      const dateCol = document.createElement('div');
      dateCol.className = 'day-date';
      const numEl = document.createElement('span');
      numEl.className = 'num' + dowClass;
      numEl.textContent = cellDate.getDate();
      const dowEl = document.createElement('span');
      dowEl.className = 'dow' + dowClass;
      dowEl.textContent = `(${WEEKDAY_LABELS[dow]})`;
      dateCol.appendChild(numEl);
      dateCol.appendChild(dowEl);
      row.appendChild(dateCol);

      const content = document.createElement('div');
      content.className = 'day-content';

      const { matched, solo } = computeDaySummaries(schedule[ds]);
      if (matched.length > 0) row.classList.add('has-match');
      matched.forEach(seg => {
        const s = document.createElement('div');
        s.className = 'summary-line tier-' + Math.min(seg.icons.length, 4);
        const icons = seg.icons.map(ic => `<span class="icon-fixed">${ic}</span>`).join('');
        s.innerHTML = `${icons}:\n${formatHM(seg.start)} ~ ${formatHM(seg.end)}`;
        content.appendChild(s);
      });
      if (solo.length > 0) {
        const soloWrap = document.createElement('div');
        soloWrap.className = 'solo-wrap';
        solo.forEach(seg => {
          const s = document.createElement('div');
          s.className = 'summary-line-solo';
          s.innerHTML = `<span class="icon-fixed">${seg.icon}</span>: ${formatHM(seg.start)} ~ ${formatHM(seg.end)}`;
          soloWrap.appendChild(s);
        });
        content.appendChild(soloWrap);
      }
      row.appendChild(content);
      list.appendChild(row);
    }
  }

  // ---------- ホイールピッカー ----------
  const ITEM_H = 36;

  function buildWheel(containerEl, items, initialIndex, onChange, options) {
    const loop = !!(options && options.loop);
    const N = items.length;
    const REPEAT = loop ? 9 : 1;      // ループ用に同じ並びを複製して無限スクロールに見せる
    const MIDDLE = Math.floor(REPEAT / 2);

    containerEl.innerHTML = '';
    const highlight = document.createElement('div');
    highlight.className = 'wheel-highlight';
    containerEl.appendChild(highlight);

    const viewport = document.createElement('div');
    viewport.className = 'wheel-viewport';
    containerEl.appendChild(viewport);

    for (let c = 0; c < REPEAT; c++) {
      items.forEach((label) => {
        const item = document.createElement('div');
        item.className = 'wheel-item';
        item.textContent = label;
        viewport.appendChild(item);
      });
    }

    const children = viewport.children;
    function markSelected(rawIndex) {
      for (let i = 0; i < children.length; i++) {
        children[i].classList.toggle('selected', i === rawIndex);
      }
    }
    function rawFromValue(valueIndex) { return MIDDLE * N + valueIndex; }

    let scrollTimer = null;
    let currentIndex = initialIndex;
    let dragging = false;

    function snapToNearest() {
      let raw = Math.round(viewport.scrollTop / ITEM_H);
      raw = Math.max(0, Math.min(children.length - 1, raw));
      const valueIndex = ((raw % N) + N) % N;
      let targetRaw = raw;
      let instant = false;
      if (loop) {
        const copyIndex = Math.floor(raw / N);
        if (copyIndex <= 1 || copyIndex >= REPEAT - 2) {
          // 端の複製に近づいたら見た目が同じ真ん中の複製へ瞬時に戻し、無限ループに見せる
          targetRaw = rawFromValue(valueIndex);
          instant = true;
        }
      }
      viewport.scrollTo({ top: targetRaw * ITEM_H, behavior: instant ? 'auto' : 'smooth' });
      currentIndex = valueIndex;
      markSelected(targetRaw);
      onChange(valueIndex);
    }

    viewport.addEventListener('scroll', () => {
      if (dragging) return; // ドラッグ中はpointerup側でスナップさせる
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(snapToNearest, 100);
    });

    // マウス/タッチのドラッグでホイールを回せるようにする
    let startY = 0;
    let startScrollTop = 0;
    viewport.addEventListener('pointerdown', (e) => {
      dragging = true;
      clearTimeout(scrollTimer);
      startY = e.clientY;
      startScrollTop = viewport.scrollTop;
      viewport.setPointerCapture(e.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      viewport.scrollTop = startScrollTop - (e.clientY - startY);
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      viewport.classList.remove('dragging');
      try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
      snapToNearest();
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    viewport.addEventListener('pointerleave', (e) => { if (dragging) endDrag(e); });

    // 初期位置へ即座にスクロール
    requestAnimationFrame(() => {
      const raw = rawFromValue(initialIndex);
      viewport.scrollTop = raw * ITEM_H;
      markSelected(raw);
    });

    return {
      getIndex: () => currentIndex,
      setIndex: (valueIndex) => {
        const raw = rawFromValue(valueIndex);
        viewport.scrollTop = raw * ITEM_H;
        currentIndex = valueIndex;
        markSelected(raw);
      },
    };
  }

  let wheels = {};
  const DEFAULT_START_HOUR = 18;
  const DEFAULT_END_HOUR = 23;

  function initWheels() {
    wheels.startHour = buildWheel(document.getElementById('wheelStartHour'), HOURS.map(String), DEFAULT_START_HOUR, () => {}, { loop: true });
    wheels.startMinute = buildWheel(document.getElementById('wheelStartMinute'), MINUTES.map(m => pad2(m)), 0, () => {}, { loop: true });
    wheels.endHour = buildWheel(document.getElementById('wheelEndHour'), HOURS.map(String), DEFAULT_END_HOUR, () => {}, { loop: true });
    wheels.endMinute = buildWheel(document.getElementById('wheelEndMinute'), MINUTES.map(m => pad2(m)), 0, () => {}, { loop: true });
  }

  // ---------- モーダル ----------
  let editingEntryId = null;

  async function openModal(ds) {
    activeDateStr = ds;
    editingEntryId = null;
    const [y, m, d] = ds.split('-').map(Number);
    document.getElementById('modalTitle').textContent = `${m}月${d}日 の時間`;
    document.getElementById('overlay').hidden = false;

    schedule = await fetchSchedule(); // 他のURLで追加された最新の内容を取得

    const editorArea = document.getElementById('editorArea');
    const notice = document.getElementById('readonlyNotice');
    if (CURRENT_USER) {
      editorArea.hidden = false;
      notice.hidden = true;
      initWheels();
      // 自分の予定が既にあれば、最初から編集モードで開く(別途「別で時間を登録」で複数登録も可能)
      const existing = (schedule[activeDateStr] || []).find(e => e.person === CURRENT_USER);
      if (existing) {
        editingEntryId = existing.id;
        wheels.startHour.setIndex(Math.floor(existing.startMin / 60) % 24);
        wheels.startMinute.setIndex(Math.max(0, MINUTES.indexOf(existing.startMin % 60)));
        wheels.endHour.setIndex(Math.floor(existing.endMin / 60) % 24);
        wheels.endMinute.setIndex(Math.max(0, MINUTES.indexOf(existing.endMin % 60)));
      }
      updateAddButtonLabel();
    } else {
      editorArea.hidden = true;
      notice.hidden = false;
    }
    renderEntryList();
  }

  function closeModal() {
    document.getElementById('overlay').hidden = true;
    activeDateStr = null;
    editingEntryId = null;
    renderCalendar();
  }

  function updateAddButtonLabel() {
    document.getElementById('addEntryBtn').textContent = editingEntryId ? '更新する' : '時間を登録';
    // 既存の予定を編集中の時だけ、別枠での新規登録ボタンを出す
    document.getElementById('addSeparateBtn').hidden = !editingEntryId;
  }

  // forceNew=false: 編集中の予定があればそれを上書き、無ければ新規追加(通常の登録・更新ボタン)
  // forceNew=true : 編集中の予定があっても上書きせず、必ず新規の別予定として追加(「別で時間を登録」ボタン)
  async function submitEntry(forceNew) {
    if (!activeDateStr || !CURRENT_USER) return;
    const startHour = HOURS[wheels.startHour.getIndex()];
    const startMinute = MINUTES[wheels.startMinute.getIndex()];
    const endHour = HOURS[wheels.endHour.getIndex()];
    const endMinute = MINUTES[wheels.endMinute.getIndex()];
    const startMin = startHour * 60 + startMinute;
    const endMin = endHour * 60 + endMinute;

    if (!schedule[activeDateStr]) schedule[activeDateStr] = [];
    const target = (!forceNew && editingEntryId)
      ? schedule[activeDateStr].find(e => e.id === editingEntryId && e.person === CURRENT_USER)
      : null;

    if (target) {
      target.startMin = startMin;
      target.endMin = endMin;
    } else {
      schedule[activeDateStr].push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        person: CURRENT_USER,
        startMin,
        endMin,
      });
    }
    editingEntryId = null;
    await saveSchedule();
    closeModal(); // 押したらポップアップを閉じる
  }

  async function deleteEntry(id) {
    if (!activeDateStr || !schedule[activeDateStr]) return;
    const entry = schedule[activeDateStr].find(e => e.id === id);
    if (!entry || entry.person !== CURRENT_USER) return; // 自分の予定だけ削除可能
    schedule[activeDateStr] = schedule[activeDateStr].filter(e => e.id !== id);
    if (schedule[activeDateStr].length === 0) delete schedule[activeDateStr];
    if (editingEntryId === id) {
      editingEntryId = null;
      updateAddButtonLabel();
    }
    await saveSchedule();
    renderEntryList();
  }

  function renderEntryList() {
    const list = document.getElementById('entryList');
    list.innerHTML = '';
    const entries = schedule[activeDateStr] || [];
    if (entries.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'entry-empty';
      empty.textContent = 'まだ登録されていません。';
      list.appendChild(empty);
      return;
    }
    entries.forEach(e => {
      const isOwn = e.person === CURRENT_USER;
      const row = document.createElement('div');
      row.className = 'entry-row' + (e.id === editingEntryId ? ' editing' : '') + (isOwn ? '' : ' foreign');
      const label = document.createElement('span');
      label.innerHTML = `<span class="icon-fixed">${e.person}</span>: ${formatHM(e.startMin)}〜${formatHM(e.endMin)}`;
      row.appendChild(label);
      if (isOwn) {
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.onclick = (ev) => { ev.stopPropagation(); deleteEntry(e.id); };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') closeModal();
  });

  refreshAndRender();
</script>
</body>
